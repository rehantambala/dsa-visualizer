services:
  - type: web
    name: pixelds-backend
    env: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        sync: false
